<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - ONG Esperança</title>
</head>
<body>
<header>

    <h1>Seja um colaborador</h1>
    <nav>
        <a href="index.html">Início</a>
        <a href="projetos.html">Projetos</a>
        <a href="cadastro.html">Cadastro</a>
    </nav>
</header>
<main>
    <form id="formCadastro">
        <fieldset>
            <legend>Dados pessoais</legend>
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="nascimento">Data de nascimento:</label>
            <input type="date" id="nascimento" name="nascimento" required>

            <label for="telefone">Telefone para contato:</label>
            <input type="tel" id="telefone" name="telefone" required placeholder="(11) 99999-9999"
                   pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}">

            <label  for="cpf">Número de identificação CPF</label>
            <input type="text" id="cpf" name="cpf" required placeholder="000.000.000-00"
                   pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}">
        </fieldset>
        <fieldset>
            <legend>Endereço</legend>
            <label for="cep">CEP</label>
            <input type="text" id="cep" name="cep" required placeholder="00000-000"
                   pattern="[0-9]{5}-[0-9]{3}">
            <label for="rua">Endereço</label>
            <input type="text" id="rua" name="rua" required placeholder="Ex.: Rua das Flores">

            <label for="numero">Número</label>
            <input type="text" id="numero" name="numero" required placeholder="Número da residência">

            <label  for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" required>

            <label for="estado">Estado</label>
            <select id="estado" name="estado" required>
                <option value="">Selecione um estado</option>
                <option value="SP">São Paulo</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="MG">Minas Gerais</option>
            </select>
        </fieldset>
        <fieldset>
            <legend>Formas de colaboração</legend>
            <p>Como você deseja colaborar com a ONG Esperança?</p>

            <input type="radio" id="voluntario" name="colaboracao" value="voluntario" required>
            <label for="voluntario">Trabalho Voluntário</label>

            <input type="radio" id="doacao" name="colaboracao" value="doacao" required>
            <label for="doacao">Doação</label>

            <input type="radio" id="ambos" name="colaboracao" value="ambos" required>
            <label for="ambos">Ambos</label>
        </fieldset>
        <button type="submit">Enviar Cadastro</button>

</form>

<script src="../js/cadastro.js"></script>

</body>
</html>
